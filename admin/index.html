<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>CALCOS LP — Panel</title>
  <link rel="stylesheet" href="./admin.css">
</head>
<body>
  <header class="lp-admin-header">
    <div class="lp-brand">CALCOS<span>LP</span></div>
    <div class="lp-admin-sub">PANEL DE CONTROL</div>
  </header>
  <main id="nc-root"></main>

  <script>
    window.CMS_MANUAL_INIT = false;
  </script>
  <script src="https://unpkg.com/decap-cms@beta/dist/decap-cms.js"></script>
  <script>
    (function () {
      if (!window.CMS) return;

      var previewCss = `
        :root { color-scheme: dark; }
        * { box-sizing: border-box; }
        body { margin:0; padding:24px; background:#070707; color:#f4f4f4; font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
        .lp-preview-wrap { max-width:560px; margin:0 auto; }
        .lp-preview-label { font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:#ff2638; font-weight:800; margin:0 0 12px; }
        .lp-card { overflow:hidden; border:1px solid #303030; border-radius:24px; background:#101010; box-shadow:0 18px 60px rgba(0,0,0,.35); }
        .lp-img { display:block; width:100%; aspect-ratio:1/1; object-fit:cover; background:#181818; }
        .lp-body { padding:22px; }
        .lp-cat { color:#ff2638; font-size:12px; letter-spacing:.18em; font-weight:900; text-transform:uppercase; }
        .lp-title { margin:8px 0 8px; font-size:28px; line-height:1.05; font-weight:900; }
        .lp-desc { margin:0 0 16px; color:#aaa; line-height:1.5; font-size:15px; }
        .lp-price { color:#ff2638; font-size:26px; font-weight:900; }
        .lp-badge { display:inline-block; margin-bottom:12px; padding:7px 11px; border-radius:999px; background:#ff2638; color:white; font-size:11px; font-weight:900; letter-spacing:.08em; }
        .lp-empty { padding:42px 22px; border:1px dashed #444; border-radius:20px; color:#aaa; text-align:center; }
      `;
      window.CMS.registerPreviewStyle(previewCss, { raw: true });

      var h = window.h;
      var createClass = window.createClass;

      var ProductPreview = createClass({
        render: function () {
          var entry = this.props.entry;
          var getAsset = this.props.getAsset;
          var v = function (key, fallback) {
            var x = entry.getIn(['data', key]);
            return x == null || x === '' ? fallback : x;
          };
          var image = v('image', '');
          var src = '';
          try { src = image ? getAsset(image).toString() : ''; } catch (e) { src = image || ''; }

          var categoryMap = {
            cuadros: 'Cuadros',
            planchas: 'Planchas',
            gaming: 'Gaming',
            personalizados: 'Personalizados',
            packs: 'Packs'
          };

          return h('div', { className: 'lp-preview-wrap' },
            h('div', { className: 'lp-preview-label' }, 'Vista previa CALCOS LP'),
            h('div', { className: 'lp-card' },
              src ? h('img', { className: 'lp-img', src: src, alt: v('name','Producto') }) :
                h('div', { className: 'lp-empty' }, 'Subí una imagen para verla acá'),
              h('div', { className: 'lp-body' },
                v('badge','') ? h('div', { className: 'lp-badge' }, v('badge','')) : null,
                h('div', { className: 'lp-cat' }, categoryMap[v('category','')] || 'Producto'),
                h('div', { className: 'lp-title' }, v('name','Nuevo producto')),
                h('p', { className: 'lp-desc' }, v('description','Descripción del producto')),
                h('div', { className: 'lp-price' }, v('price','Consultar'))
              )
            )
          );
        }
      });

      window.CMS.registerPreviewTemplate('products', ProductPreview);
    })();
  </script>
</body>
</html>
