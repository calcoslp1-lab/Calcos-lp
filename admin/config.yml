backend:
  name: turbo-github
  turbo_site_id: "6708e0f5-0f35-4719-8901-535ad0ac666a"
  branch: main

site_url: https://calcos-lp.netlify.app
logo:
  src: "/assets/logo.jpg"
  show_in_header: true

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: settings
    label: "Configuración de la web"
    editor:
      preview: false
    files:
      - label: "General"
        name: general
        file: "content/settings.json"
        fields:
          - { label: "Marca", name: brand, widget: string }
          - { label: "WhatsApp (solo números)", name: whatsapp, widget: string, hint: "Ejemplo: 542664191027" }
          - { label: "Teléfono visible", name: phone, widget: string }
          - { label: "Texto pequeño del hero", name: heroEyebrow, widget: string }
          - { label: "Título principal", name: heroTitle, widget: string }
          - { label: "Texto principal", name: heroText, widget: text }
          - { label: "Imagen principal", name: heroImage, widget: image }
          - { label: "Precio desde personalizados", name: customPrice, widget: string }
          - { label: "Instagram", name: instagram, widget: string, required: false }
          - { label: "Texto de envíos", name: shippingText, widget: text }

  - name: products
    label: "Productos"
    description: "Editá el catálogo y mirá una vista previa visual del producto."
    editor:
      preview: true
    files:
      - label: "Catálogo"
        name: catalog
        file: "content/products.json"
        fields:
          - label: "Productos"
            name: products
            widget: list
            summary: "{{name}} — {{price}}"
            fields:
              - { label: "ID", name: id, widget: string, required: false, hint: "Identificador interno. No hace falta cambiarlo." }
              - { label: "Nombre", name: name, widget: string }
              - label: "Categoría"
                name: category
                widget: select
                options:
                  - { label: "Cuadros", value: "cuadros" }
                  - { label: "Planchas", value: "planchas" }
                  - { label: "Gaming", value: "gaming" }
                  - { label: "Personalizados", value: "personalizados" }
                  - { label: "Packs", value: "packs" }
              - { label: "Imagen", name: image, widget: image }
              - { label: "Precio", name: price, widget: string }
              - { label: "Descripción", name: description, widget: text, required: false }
              - { label: "Destacado", name: featured, widget: boolean, default: false }
              - { label: "Etiqueta", name: badge, widget: string, required: false, hint: "Ej.: DESTACADO, NUEVO, PREMIUM, PACK" }
              - { label: "Visible", name: visible, widget: boolean, default: true }
